<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BarShop</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:22px 20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.container{
    padding:20px;
    max-width:600px;
    margin:auto;
}

.welcome{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.welcome h2{
    margin:0 0 10px;
}

.welcome p{
    margin:0;
    color:#666;
    font-size:16px;
}

.start{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.start h2{
    margin-top:0;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}
</style>
</head>

<body>

<header>
    BarShop
</header>

<div class="container">

    <div class="welcome">
        <h2>مرحبا بك في BarShop 👋</h2>
        <p>متجرك في مكان واحد.</p>
    </div>

    <div class="start">
        <h2>ابدأ الآن</h2>

        <button onclick="enterShop()">
            دخول
        </button>
    </div>

</div>

<script>
function enterShop(){
    alert("أهلاً بك في BarShop ✅");
}
</script>

</body>
</html>
