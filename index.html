<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BarShop</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#111;
}

header{
    background:#111;
    color:white;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:17px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    BarShop
</header>

<div class="container">

    <div class="card">
        <h2>مرحبا بك في BarShop 👋</h2>
        <p>متجرك في مكان واحد.</p>
    </div>

    <div class="card">
        <h2>ابدأ الآن</h2>
        <button onclick="alert('أهلاً بك في BarShop ✅')">
            دخول
        </button>
    </div>

</div>

</body>
                                </html>
